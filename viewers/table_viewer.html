<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meta-regressions and survivor correlations</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 20px; background: #fff; }
  h1 { font-family: "Styrene B", sans-serif; font-size: 1.4em; margin-bottom: 10px; }
  .controls { font-family: "Styrene B", sans-serif; }
  .layout { display: flex; gap: 20px; align-items: flex-start; }
  .controls { display: flex; flex-direction: column; gap: 14px;
              padding: 12px 16px; min-width: 210px; position: sticky; top: 20px; }
  .control-group { display: flex; flex-direction: column; gap: 2px; }
  .control-group .group-label { font-size: 0.8em; font-weight: 600; color: #555;
                          text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .control-group label { font-size: 0.9em; cursor: pointer; }
  .control-group input[type=radio] { margin-right: 4px; }
  .table-container { flex: 1; }
  .table-container iframe { border: none; width: 100%; display: block;
                            overflow: hidden; }
  #tableFrame { height: 600px; }
  #corrFrame { height: 400px; margin-top: 24px; }
  .filename { font-size: 0.85em; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<h1>Meta-Regression Table Viewer</h1>
<div class="layout">
<div class="controls">
  <div class="control-group">
    <div class="group-label">Outcome</div>
    <label><input type="radio" name="outcome" value="emp" checked> Employment</label>
    <label><input type="radio" name="outcome" value="earn"> Earnings</label>
    <label><input type="radio" name="outcome" value="program_takeup"> Program take-up</label>
    <label><input type="radio" name="outcome" value="any_training"> Any-training take-up</label>
  </div>
  <div class="control-group">
    <div class="group-label">Time horizon</div>
    <label><input type="radio" name="horizon" value="st" checked> Short-term (~1-year)</label>
    <label><input type="radio" name="horizon" value="mt"> Medium-term (~2-year)</label>
    <label><input type="radio" name="horizon" value="lt"> Long-term (~3-5-year)</label>
  </div>
  <div class="control-group">
    <div class="group-label">Approach</div>
    <label><input type="radio" name="approach" value="cc" checked> Complete case</label>
    <label><input type="radio" name="approach" value="mi"> Multiple imputation</label>
  </div>
  <div class="control-group">
    <div class="group-label">Sample</div>
    <label><input type="radio" name="sample" value="" checked> Full sample</label>
    <label><input type="radio" name="sample" value="_primary"> Training is primary in intervention</label>
  </div>
</div>
<div class="table-container">
  <iframe id="tableFrame" src="" scrolling="no"></iframe>
  <div class="filename" id="filename"></div>
  <iframe id="corrFrame" src="" scrolling="no"></iframe>
  <div class="filename" id="corrFilename"></div>
</div>
</div>
<script>
function getRadio(name) {
  return document.querySelector(`input[name="${name}"]:checked`).value;
}

// The pane HTMLs (table_*.html, corr_*.html) post their rendered height to us
// via postMessage. We size each iframe to fit so there's no inner scroll.
// Each update() captures the current scrollY and waits for both panes to
// resize before restoring it — that way the user stays put when switching.
let pendingResizes = null;
let pendingScrollY = 0;

function paneResized(name) {
  if (!pendingResizes || !pendingResizes.has(name)) return;
  pendingResizes.delete(name);
  if (pendingResizes.size > 0) return;
  const target = pendingScrollY;
  pendingResizes = null;
  // Two rAFs: let layout flush, then beat the browser's scroll anchoring.
  requestAnimationFrame(() =>
    requestAnimationFrame(() => window.scrollTo(0, target)));
}

window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'iframeHeight') return;
  const tFrame = document.getElementById('tableFrame');
  const cFrame = document.getElementById('corrFrame');
  if (e.source === tFrame.contentWindow) {
    tFrame.style.height = e.data.height + 'px';
    paneResized('table');
  } else if (e.source === cFrame.contentWindow) {
    cFrame.style.height = e.data.height + 'px';
    paneResized('corr');
  }
});

// Setting `iframe.src` adds a parent-page history entry per iframe per
// radio click — pressing Back then walks back through old settings instead
// of leaving the viewer. `contentWindow.location.replace(url)` swaps the
// document without adding a history entry.
function navigateFrame(frame, url) {
  try {
    frame.contentWindow.location.replace(url);
  } catch (e) {
    frame.src = url;
  }
}

function update() {
  const oc = getRadio('outcome');
  const hz = getRadio('horizon');
  const ap = getRadio('approach');
  const sm = getRadio('sample');
  // Take-up outcomes are horizon-less: their filenames omit the time horizon,
  // and the horizon control is disabled while one is selected.
  const isTakeup = (oc === 'program_takeup' || oc === 'any_training');
  document.querySelectorAll('input[name="horizon"]').forEach(r => r.disabled = isTakeup);
  const fn = isTakeup ? `table_${oc}_${ap}${sm}.html`
                      : `table_${oc}_${hz}_${ap}${sm}.html`;
  const corrFn = isTakeup ? `corr_${oc}_${ap}${sm}.html`
                          : `corr_${oc}_${hz}_${ap}${sm}.html`;
  const frame = document.getElementById('tableFrame');
  const corrFrame = document.getElementById('corrFrame');
  const label = document.getElementById('filename');
  const corrLabel = document.getElementById('corrFilename');

  pendingScrollY = window.scrollY;
  pendingResizes = new Set(['table', 'corr']);

  navigateFrame(frame, '../output/' + fn);
  label.textContent = fn;
  navigateFrame(corrFrame, '../output/' + corrFn);
  corrLabel.textContent = corrFn;
}
document.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', update));
update();
</script>
</body>
</html>
